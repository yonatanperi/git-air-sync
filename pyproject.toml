[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-air-sync"
version = "0.1.0"
description = "Sync git repositories across an air gap using .docx files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[project.optional-dependencies]
pretty = ["rich>=13", "questionary>=2.0"]

[project.scripts]
git-air-sync = "git_air_sync.main:main"

[tool.setuptools.packages.find]
include = ["git_air_sync*"]

[tool.setuptools.package-data]
"git_air_sync.vendor.codec" = ["PROVENANCE.md"]
